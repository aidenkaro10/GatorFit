<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GatorFit</title>
  <link rel="icon" href="https://www.peakpulseclub.com/cdn/shop/files/sun_favicon.png?crop=center&height=32&v=1750684565&width=32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css?v=30" />
  <link rel="stylesheet" href="css/rsvp.css?v=30" />
  <link rel="stylesheet" href="css/leaderboard.css?v=30" />
  <link rel="stylesheet" href="css/partner.css?v=30" />
  <link rel="stylesheet" href="css/log.css?v=30" />
  <link rel="stylesheet" href="css/share.css?v=30" />
  <!-- The app is light mode only -->
  <script>document.documentElement.dataset.theme = "light";</script>
</head>
<body>
  <div id="app">
    <!-- LEFT: sidebar with logo, your stats, tabs, and settings -->
    <aside id="sidebar">
      <div class="logo-row">
        <div class="logo brand-logo"><img src="https://www.peakpulseclub.com/cdn/shop/files/white_text_peak_pulse_logo_with_sun.png?v=1750709848&width=600" alt="Peak Pulse" onerror="this.parentNode.classList.add('no-img')" /><span class="logo-fallback"><span class="sun">☀</span> PEAK PULSE</span></div>
        <div class="logo-sub">GatorFit</div>
        <span id="demoPill" class="demo-pill" hidden>DEMO MODE</span>
      </div>

      <!-- Your name, points, and rank get drawn here by js/app.js -->
      <div id="header"></div>

      <!-- Icons are inline Lucide SVGs (same markup PP.ui.icon makes) -->
      <nav id="tabbar">
        <button data-action="app-tab" data-tab="rsvp"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><path d="M8 2v3" /> <path d="M16 2v3" /> <rect x="3" y="3" width="18" height="18" rx="2" /> <path d="M3 9h18" /></svg>RSVP</button>
        <button data-action="app-tab" data-tab="leaderboard"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><path d="M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2" /> <path d="M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2" /> <path d="M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3" /> <path d="M4 22h16" /> <path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z" /> <path d="M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3" /></svg>Leaderboard</button>
        <button data-action="app-tab" data-tab="partner"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /> <path d="M16 3.128a4 4 0 0 1 0 7.744" /> <path d="M22 21v-2a4 4 0 0 0-3-3.87" /> <circle cx="9" cy="7" r="4" /></svg>Find a Partner</button>
        <button data-action="app-tab" data-tab="log"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="M8 12h8" /> <path d="M12 8v8" /></svg>Log</button>
      </nav>

      <div class="side-bottom">
        <button class="btn btn-ghost btn-block" data-action="app-signout"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><path d="m16 17 5-5-5-5" /> <path d="M21 12H9" /> <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></svg>Sign out</button>
      </div>
    </aside>

    <!-- RIGHT: the current tab's content gets drawn here by the page files -->
    <main id="screen"></main>
  </div>

  <!-- Sign in + onboarding screen -->
  <div id="onboarding" class="overlay" hidden></div>

  <!-- Meditation lock screen (used by the Log page) -->
  <div id="medOverlay" class="overlay" hidden></div>

  <!-- Little pop-up messages -->
  <div id="toast"></div>

  <!-- 1. Supabase library (if it fails to load, the app runs in DEMO MODE) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. Config made by scripts/make-config.mjs. If it's missing, DEMO MODE. -->
  <script src="config.js" onerror="window.PP_CONFIG = window.PP_CONFIG || null"></script>
  <!-- 3. Shared code, in order -->
  <script src="js/points.js?v=30"></script>
  <script src="js/mock-data.js?v=30"></script>
  <script src="js/ui.js?v=30"></script>
  <script src="js/db.js?v=30"></script>
  <!-- 4. The 4 pages -->
  <script src="js/ai.js?v=30"></script>
  <script src="js/share.js?v=30"></script>
  <script src="js/pages/rsvp.js?v=30"></script>
  <script src="js/pages/leaderboard.js?v=30"></script>
  <script src="js/pages/partner.js?v=30"></script>
  <script src="js/pages/log.js?v=30"></script>
  <!-- 5. Boot the app -->
  <script src="js/app.js?v=30"></script>
</body>
</html>
